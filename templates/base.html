{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}مدیریت دوره‌ها{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'home' %}" class="brand">مدیریت دوره‌ها</a>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <span>{{ user.get_full_name|default:user.username }}</span>
                <form method="post" action="{% url 'accounts:logout' %}" class="inline-form">
                    {% csrf_token %}
                    <button type="submit" class="link-button">خروج</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">ورود</a>
                <a href="{% url 'accounts:register' %}">ثبت‌نام</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">پروژه درس برنامه‌نویسی وب</footer>
</body>
</html>
