<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}مدیریت دوره‌ها{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{% url 'home' %}">صفحه اصلی</a>
        {% if user.is_authenticated %}
            {{ user.username }}
            <form method="post" action="{% url 'accounts:logout' %}" style="display:inline">
                {% csrf_token %}
                <button type="submit">خروج</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">ورود</a>
            <a href="{% url 'accounts:register' %}">ثبت‌نام</a>
        {% endif %}
    </nav>
    <hr>

    {% block content %}{% endblock %}
</body>
</html>
